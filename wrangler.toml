name = "cnr"
main = "src/index.js"
compatibility_date = "2024-01-01"

kv_namespaces = [
  { binding = "CNR_CACHE", id = "83873a054dcb463eb2cf4283b2868fc1" }
]

[durable_objects]
bindings = [
  { name = "CNR_WRITE_BUFFER", class_name = "CNRWriteBuffer" }
]

[triggers]
crons = ["*/5 * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[observability.logs]
enabled = false
invocation_logs = true

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "CNRWriteBuffer" ]